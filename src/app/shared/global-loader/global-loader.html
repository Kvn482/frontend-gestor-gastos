@if (loadingService.visible()) {
  <div class="pointer-events-none fixed inset-x-0 top-0 z-[80] h-1 overflow-hidden bg-indigo-100 dark:bg-slate-800">
    <div class="global-loader-bar h-full w-1/3 rounded-r-full bg-indigo-600 dark:bg-indigo-400"></div>
  </div>

  <div class="pointer-events-none fixed inset-x-0 top-5 z-[80] flex justify-center px-4">
    <div class="flex w-full max-w-md items-center gap-3 rounded-2xl border border-indigo-100 bg-white px-4 py-3.5 text-slate-800 shadow-2xl shadow-slate-900/20 ring-1 ring-white/70 backdrop-blur dark:border-indigo-900/70 dark:bg-[#172033] dark:text-slate-100 dark:ring-slate-700/50">
      <span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-indigo-600 text-white shadow-lg shadow-indigo-600/25 dark:bg-indigo-500">
        <span class="global-loader-spinner h-5 w-5 rounded-full border-2 border-current border-r-transparent"></span>
      </span>

      <span class="min-w-0">
        <span class="block text-sm font-black text-slate-900 dark:text-white">
          @if (loadingService.slow()) {
            Activando el servidor
          } @else {
            Cargando
          }
        </span>
        <span class="mt-0.5 block text-xs font-semibold text-slate-500 dark:text-slate-400">
          @if (loadingService.slow()) {
            Esto puede tardar unos segundos si el backend estaba en reposo.
          } @else {
            Preparando tu informacion...
          }
        </span>
      </span>
    </div>
  </div>
}
