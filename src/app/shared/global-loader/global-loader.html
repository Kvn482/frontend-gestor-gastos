@if (loadingService.visible()) {
  <div class="pointer-events-none fixed inset-x-0 top-0 z-[80] h-1 overflow-hidden bg-indigo-100 dark:bg-slate-800">
    <div class="global-loader-bar h-full w-1/3 rounded-r-full bg-indigo-600 dark:bg-indigo-400"></div>
  </div>

  <div class="pointer-events-none fixed inset-x-0 bottom-4 z-[80] flex justify-center px-4">
    <div class="flex max-w-sm items-center gap-3 rounded-2xl border border-slate-200 bg-white/95 px-4 py-3 text-slate-700 shadow-2xl shadow-slate-900/15 backdrop-blur dark:border-slate-700 dark:bg-[#172033]/95 dark:text-slate-200">
      <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-indigo-50 text-indigo-600 dark:bg-indigo-950/60 dark:text-indigo-300">
        <span class="global-loader-spinner h-4 w-4 rounded-full border-2 border-current border-r-transparent"></span>
      </span>

      <span class="min-w-0">
        <span class="block text-sm font-black">
          @if (loadingService.slow()) {
            Activando el servidor
          } @else {
            Cargando
          }
        </span>
        <span class="mt-0.5 block text-xs font-semibold text-slate-400 dark:text-slate-500">
          @if (loadingService.slow()) {
            Esto puede tardar unos segundos si el backend estaba en reposo.
          } @else {
            Preparando tu informacion...
          }
        </span>
      </span>
    </div>
  </div>
}
