@if (toastService.toast(); as toast) {
<div id="toast-top-right"
  class="fixed z-[9999] flex items-center w-[calc(100%_-_2rem)] max-w-sm gap-3 px-4 py-3.5 rounded-2xl border shadow-xl backdrop-blur-md top-5 end-4 sm:end-5"
  [class.toast-enter]="!toast.exiting"
  [class.toast-exit]="toast.exiting"
  [ngClass]="{
    'text-emerald-900 bg-emerald-100 border-emerald-500': toast.type === 'success',
    'text-rose-900 bg-rose-100 border-rose-500': toast.type === 'error',
    'text-amber-900 bg-amber-100 border-amber-500': toast.type === 'warning',
    'text-sky-900 bg-sky-100 border-sky-500': toast.type === 'info'
  }">

  @if (toast.type === 'warning') {
    <svg class="h-5 w-5 shrink-0 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
      <path d="M12 9v4m0 4h.01M10.3 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.7 3.86a2 2 0 0 0-3.4 0Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  }

  <div class="text-sm font-medium flex-1">
    {{ toast.message }}
  </div>

  @if (toast.action) {
    <button
      type="button"
      (click)="toast.action.callback(); toastService.clear()"
      class="ms-2 px-2.5 py-1 text-xs font-bold rounded-lg underline hover:opacity-80 transition cursor-pointer"
    >
      {{ toast.action.label }}
    </button>
  }

  <div class="ms-auto">
    <button type="button" aria-label="Cerrar notificación" (click)="toastService.clear()" class="grid h-8 w-8 place-items-center rounded-lg text-current/70 hover:bg-black/5 hover:text-current cursor-pointer transition">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path d="M6 18 17.94 6M18 18 6.06 6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</div>
}
