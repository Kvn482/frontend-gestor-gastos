<button (click)="go()"
  class="group flex h-20 flex-col items-center justify-center gap-1.5
  rounded-[1.25rem] p-2
  bg-indigo-50 dark:bg-slate-800/70 border border-transparent dark:border-slate-700
  hover:bg-indigo-100 dark:hover:bg-slate-800
  transition-all duration-200
  w-full cursor-pointer text-center
  min-[900px]:h-auto min-[900px]:flex-row min-[900px]:justify-start min-[900px]:gap-4 min-[900px]:p-5 min-[900px]:text-left
  min-[900px]:bg-white min-[900px]:dark:bg-slate-800/70 min-[900px]:border-slate-100 min-[900px]:dark:border-slate-700
  min-[900px]:shadow-sm min-[900px]:hover:shadow-md min-[900px]:hover:border-indigo-100 min-[900px]:dark:hover:border-indigo-700">

  <!-- Icon container -->
  <div class="flex h-6 w-6 items-center justify-center
    text-indigo-600 dark:text-indigo-300
    transition-all duration-200 shrink-0
    min-[900px]:h-11 min-[900px]:w-11 min-[900px]:rounded-xl min-[900px]:bg-indigo-50 min-[900px]:dark:bg-slate-700/60
    min-[900px]:text-indigo-600 min-[900px]:dark:text-indigo-400 min-[900px]:group-hover:bg-indigo-600 min-[900px]:group-hover:text-white">
    <ng-content select="[icon]"></ng-content>
  </div>

  <!-- Label -->
  <span class="text-xs font-semibold leading-tight text-indigo-600 dark:text-slate-200 transition-colors min-[900px]:flex-1 min-[900px]:text-sm min-[900px]:text-gray-700 min-[900px]:dark:text-slate-200 min-[900px]:group-hover:text-indigo-600 min-[900px]:dark:group-hover:text-indigo-300">
    {{ label }}
  </span>

  <!-- Arrow -->
  <svg class="hidden w-4 h-4 text-slate-300 dark:text-slate-600 group-hover:text-indigo-400 group-hover:translate-x-0.5 transition-all shrink-0 min-[900px]:block"
    xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m9 5 7 7-7 7"/>
  </svg>

</button>
