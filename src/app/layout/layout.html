<aside
  class="hidden sm:block fixed top-0 left-0 z-40 w-64 h-screen"
  aria-label="Sidebar">
  <div class="h-full flex flex-col px-4 py-5 overflow-y-auto bg-slate-900">

    <!-- Logo -->
    <div class="flex items-center gap-1 px-2 mb-8">
      <img class="w-12 h-12" src="/img/logo.png" alt="Logo de Monetra">
      <span class="text-white text-xl font-bold tracking-tight">Monetra</span>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 space-y-1">
      <p class="text-slate-500 text-xs font-semibold uppercase tracking-widest px-3 mb-3">Principal</p>
      <a routerLink="/inicio" routerLinkActive="bg-slate-800 text-white" [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white group transition-all duration-150">
        <svg class="w-5 h-5 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="m3 10.5 9-7 9 7" />
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M5 10v9a1 1 0 0 0 1 1h4v-5h4v5h4a1 1 0 0 0 1-1v-9" />
        </svg>
        <span class="text-sm font-medium">Inicio</span>
      </a>
      <a routerLink="/cuentas" routerLinkActive="bg-slate-800 text-white"
        class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white group transition-all duration-150">
        <svg class="w-5 h-5 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 8H5m12 0a1 1 0 0 1 1 1v2.6M17 8l-4-4M5 8a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.6M5 8l4-4 4 4m6 4h-4a2 2 0 1 0 0 4h4a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1Z" />
        </svg>
        <span class="text-sm font-medium">Cuentas</span>
      </a>
      <a routerLink="/analisis" routerLinkActive="bg-slate-800 text-white"
        class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white group transition-all duration-150">
        <svg class="w-5 h-5 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 15v4m6-6v6m6-4v4m6-6v6M3 11l6-5 6 5 5.5-5.5" />
        </svg>
        <span class="text-sm font-medium">Analisis</span>
      </a>
      <!-- <a routerLink="/prestamos" routerLinkActive="bg-slate-800 text-white"
        class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white group transition-all duration-150">
        <svg class="w-5 h-5 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 10h18M6 14h2m3 0h5M3 7v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1Z" />
        </svg>
        <span class="text-sm font-medium">Préstamos</span>
      </a> -->
    </nav>

    <!-- Bottom section -->
    <div class="border-t border-slate-700/60 pt-4 space-y-1">
      <!-- User profile with dropdown -->
      <div class="relative">

        @if (profileDropdownOpen) {
        <div class="fixed w-72 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl z-[9999]"
          [style.bottom.px]="dropdownBottom"
          [style.left.px]="dropdownLeft"
          (click)="$event.stopPropagation()">

          <!-- Header -->
          <div class="p-2">
            <div class="flex items-center px-2.5 py-2 space-x-1.5 rounded-lg">
              @if (tieneAvatarPersonalizado) {
                <img class="w-8 h-8 rounded-full object-cover shrink-0" [src]="profileImageUrl" alt="avatar">
              } @else {
                <div class="w-8 h-8 rounded-full bg-indigo-900/40 flex items-center justify-center text-indigo-400 text-xs font-bold shrink-0">{{ nombre.charAt(0).toUpperCase() }}{{ apellido.charAt(0).toUpperCase() }}</div>
              }
              <div class="text-sm overflow-hidden">
                <div class="font-medium text-white truncate">{{ nombreCompleto }}</div>
                <div class="truncate text-xs text-slate-400">{{ email }}</div>
              </div>
            </div>
          </div>

          <!-- Items -->
          <ul class="px-2 pb-2 text-sm text-slate-300 font-medium space-y-0.5">
            <li>
              <a routerLink="/configuracion" (click)="profileDropdownOpen = false" class="inline-flex items-center w-full p-2 rounded-lg hover:bg-slate-700 hover:text-white transition-colors">
                <svg class="w-4 h-4 me-2 shrink-0" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 0 0-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 0 0-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 0 0-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 0 0-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 0 0 1.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065Z"/><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
                Configuración
              </a>
            </li>
            <li>
              <a href="#" class="inline-flex items-center w-full p-2 rounded-lg hover:bg-slate-700 hover:text-white transition-colors">
                <svg class="w-4 h-4 me-2 shrink-0" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.529 9.988a2.502 2.502 0 1 1 5 .191A2.441 2.441 0 0 1 12 12.582V14m-.01 3.008H12M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
                Centro de ayuda
              </a>
            </li>

            <!-- Dark mode toggle -->
            <li class="flex items-center w-full px-2 py-2 hover:bg-slate-700 hover:text-white rounded-lg mb-1 transition-colors">
              <button (click)="toggleDarkMode()" type="button" class="inline-flex items-center flex-1 text-left">
                <svg class="w-4 h-4 me-2 shrink-0" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 21a9 9 0 0 1-.5-17.986V3c-.354.966-.5 1.911-.5 3a9 9 0 0 0 9 9c.239 0 .254.018.488 0A9.004 9.004 0 0 1 12 21Z"/></svg>
                Modo oscuro
              </button>
              <div class="relative w-9 h-5 shrink-0">
                <input type="checkbox" [checked]="darkMode" (change)="toggleDarkMode()" class="sr-only peer">
                <div class="w-9 h-5 bg-slate-600 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600 cursor-pointer" (click)="toggleDarkMode()"></div>
              </div>
            </li>

            <li class="border-t border-slate-700 pt-1.5">
              <button (click)="profileDropdownOpen = false; logout()" type="button"
                class="inline-flex items-center w-full p-2 text-rose-400 hover:bg-slate-700 rounded-lg transition-colors cursor-pointer">
                <svg class="w-4 h-4 me-2 shrink-0" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H8m12 0-4 4m4-4-4-4M9 4H7a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h2"/></svg>
                Cerrar sesión
              </button>
            </li>
          </ul>
        </div>
        }

        <!-- Trigger button -->
        <button (click)="toggleProfileDropdown($event)" type="button"
          class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-800 transition-all duration-150 w-full cursor-pointer">
          @if (tieneAvatarPersonalizado) {
            <img [src]="profileImageUrl" class="w-8 h-8 rounded-full object-cover ring-2 ring-indigo-500/40 shrink-0" alt="avatar" />
          } @else {
            <div class="w-8 h-8 rounded-full bg-indigo-900/40 ring-2 ring-indigo-500/40 flex items-center justify-center text-indigo-400 text-xs font-bold shrink-0">{{ nombre.charAt(0).toUpperCase() }}{{ apellido.charAt(0).toUpperCase() }}</div>
          }
          <div class="flex flex-col leading-tight overflow-hidden flex-1 text-left">
            <span class="text-white text-sm font-semibold truncate">{{ nombreCompleto }}</span>
            <span class="text-slate-400 text-xs">Mi cuenta</span>
          </div>
        </button>

      </div>
    </div>

  </div>
</aside>

<!-- Main content -->
<div class="sm:ml-64 min-h-screen bg-slate-50 dark:bg-slate-950 transition-colors duration-200">
  <div class="p-6 pb-28 sm:pb-6 md:p-8">
    <router-outlet />
  </div>
</div>

<!-- Floating Bottom Navigation Bar (solo mobile) -->
<nav
  aria-label="Navegación móvil"
  class="fixed inset-x-6 z-40 sm:hidden transition-transform duration-300 ease-out origin-bottom"
  [class.scale-90]="isScrolledDown"
  [class.translate-y-1]="isScrolledDown"
  style="bottom: calc(2rem + env(safe-area-inset-bottom, 0px));"
>
  <div
    class="relative grid grid-cols-4 p-1.5 rounded-2xl bg-slate-900/95 dark:bg-slate-900/95 backdrop-blur-xl border border-slate-800/90 shadow-2xl shadow-black/50 ring-1 ring-white/10 transition-opacity duration-300 ease-out"
    [class.opacity-90]="isScrolledDown"
  >
    <!-- Sliding Active Pill Indicator -->
    <div
      aria-hidden="true"
      class="absolute top-1.5 bottom-1.5 left-1.5 w-[calc((100%-12px)/4)] rounded-xl bg-indigo-500/20 border border-indigo-500/35 shadow-md shadow-indigo-500/20 pointer-events-none transition-transform duration-300 ease-[cubic-bezier(0.34,1.3,0.64,1)]"
      [style.transform]="'translateX(' + (activeTab * 100) + '%)'"
    >
      <div class="absolute inset-0 rounded-xl bg-gradient-to-b from-indigo-400/15 to-transparent"></div>
    </div>

    <!-- Home / Inicio -->
    <a
      routerLink="/inicio"
      (click)="irA('/inicio', 0)"
      title="Inicio"
      aria-label="Inicio"
      class="relative z-10 flex items-center justify-center py-2 rounded-xl transition-colors duration-200 active:scale-95 cursor-pointer select-none touch-manipulation"
      [class.text-indigo-400]="activeTab === 0"
      [class.text-slate-400]="activeTab !== 0"
      [class.hover:text-slate-200]="activeTab !== 0"
    >
      <svg
        class="w-5 h-5 shrink-0 pointer-events-none transition-transform duration-200"
        [class.scale-110]="activeTab === 0"
        xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
      >
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="m3 10.5 9-7 9 7" />
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M5 10v9a1 1 0 0 0 1 1h4v-5h4v5h4a1 1 0 0 0 1-1v-9" />
      </svg>
    </a>

    <!-- Cuentas -->
    <a
      routerLink="/cuentas"
      (click)="irA('/cuentas', 1)"
      title="Cuentas"
      aria-label="Cuentas"
      class="relative z-10 flex items-center justify-center py-2 rounded-xl transition-colors duration-200 active:scale-95 cursor-pointer select-none touch-manipulation"
      [class.text-indigo-400]="activeTab === 1"
      [class.text-slate-400]="activeTab !== 1"
      [class.hover:text-slate-200]="activeTab !== 1"
    >
      <svg
        class="w-5 h-5 shrink-0 pointer-events-none transition-transform duration-200"
        [class.scale-110]="activeTab === 1"
        xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
      >
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M17 8H5m12 0a1 1 0 0 1 1 1v2.6M17 8l-4-4M5 8a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.6M5 8l4-4 4 4m6 4h-4a2 2 0 1 0 0 4h4a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1Z" />
      </svg>
    </a>

    <!-- Análisis -->
    <a
      routerLink="/analisis"
      (click)="irA('/analisis', 2)"
      title="Análisis"
      aria-label="Análisis"
      class="relative z-10 flex items-center justify-center py-2 rounded-xl transition-colors duration-200 active:scale-95 cursor-pointer select-none touch-manipulation"
      [class.text-indigo-400]="activeTab === 2"
      [class.text-slate-400]="activeTab !== 2"
      [class.hover:text-slate-200]="activeTab !== 2"
    >
      <svg
        class="w-5 h-5 shrink-0 pointer-events-none transition-transform duration-200"
        [class.scale-110]="activeTab === 2"
        xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
      >
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M3 15v4m6-6v6m6-4v4m6-6v6M3 11l6-5 6 5 5.5-5.5" />
      </svg>
    </a>

    <!-- Configuración (Engrane) -->
    <a
      routerLink="/configuracion"
      (click)="irA('/configuracion', 3)"
      title="Configuración"
      aria-label="Configuración"
      class="relative z-10 flex items-center justify-center py-2 rounded-xl transition-colors duration-200 active:scale-95 cursor-pointer select-none touch-manipulation"
      [class.text-indigo-400]="activeTab === 3"
      [class.text-slate-400]="activeTab !== 3"
      [class.hover:text-slate-200]="activeTab !== 3"
    >
      <svg
        class="w-5 h-5 shrink-0 pointer-events-none transition-transform duration-200"
        [class.scale-110]="activeTab === 3"
        xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
      >
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 0 0-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 0 0-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 0 0-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 0 0-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 0 0 1.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065Z" />
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
      </svg>
    </a>
  </div>
</nav>
